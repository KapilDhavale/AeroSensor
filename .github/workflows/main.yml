```yaml
name: AeroSensor CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy for rollback'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  security-events: write
  actions: read

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies with Retry
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed. Retrying in 15 seconds..."
            sleep 15
          done
      
      - name: Check for Test and Build Scripts
        id: check_scripts
        run: |
          if npm pkg get scripts.test > /dev/null 2>&1; then
            echo "test_script_exists=true" >> $GITHUB_OUTPUT
          else
            echo "test_script_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm pkg get scripts.build > /dev/null 2>&1; then
            echo "build_script_exists=true" >> $GITHUB_OUTPUT
          else
            echo "build_script_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        if: steps.check_scripts.outputs.test_script_exists == 'true'
        run: npm test

      - name: Run Build
        if: steps.check_scripts.outputs.build_script_exists == 'true'
        run: npm run build

      - name: Archive Production Artifact
        if: steps.check_scripts.outputs.build_script_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: |
            dist/
            build/
            public/
            node_modules/
            package.json
            package-lock.json
            index.js
          if-no-files-found: ignore
          retention-days: 90

  security_scan:
    name: Security Scan
    needs: build_and_test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install Dependencies for Scanning
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy to Production
    needs: [build_and_test, security_scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aerosensor.example.com
    
    steps:
      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Deploying AeroSensor to production'
            });
            core.setOutput('deployment_id', data.id);

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: ./deploy-package

      - name: Deploy to Production Environment
        run: |
          echo "Deploying from ./deploy-package to production..."
          # Add your deployment commands here (e.g., scp, rsync, aws s3 sync, etc.)
          # Example: scp -r ./deploy-package/* user@your-server:/var/www/aerosensor
          echo "Deployment successful."

      - name: Update Deployment Status (Success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: 'https://aerosensor.example.com',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Update Deployment Status (Failure)
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  rollback:
    name: Rollback Production Deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Create GitHub Deployment for Rollback
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.inputs.commit_sha }}',
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Rolling back to commit ${{ github.event.inputs.commit_sha }}'
            });
            core.setOutput('deployment_id', data.id);

      - name: Download Previous Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ github.event.inputs.commit_sha }}
          path: ./deploy-package
        
      - name: Deploy Rolled-back Version
        run: |
          echo "Deploying rolled-back version for commit ${{ github.event.inputs.commit_sha }}..."
          # Add your deployment commands here, same as the deploy job
          echo "Rollback deployment successful."

      - name: Update Deployment Status (Success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: 'https://aerosensor.example.com',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      
      - name: Update Deployment Status (Failure)
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
```