name: CI Pipeline (Docker Validation)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "main"

jobs:
  docker-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify package.json exists
        run: |
          test -f backend/package.json || (echo "package.json not found" && exit 1)

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run tests (if present)
        working-directory: backend
        run: npm test --if-present

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ci-test:${{ github.sha }} \
            .

      - name: Run Docker container (smoke test)
        run: |
          docker run -d \
            --name ci-test \
            -e PORT=3001 \
            -e FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            -e FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            -e FIREBASE_DATABASE_URL="${{ secrets.FIREBASE_DATABASE_URL }}" \
            -e FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            -e FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            -e FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            -e FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            ci-test:${{ github.sha }}

      - name: Wait for app startup
        run: sleep 5

      - name: Show container logs
        run: docker logs ci-test

      - name: Stop container
        if: always()
        run: docker rm -f ci-test